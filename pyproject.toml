[project]
name = "agentos-kit"
version = "0.1.0"
description = "AgentOS app contract tooling: manifest schema, agentos check, and the app template"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
  "jsonschema>=4.20",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
agentos = "agentos_kit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentos_kit"]
artifacts = ["src/agentos_kit/template/**/*"]

[tool.hatch.build.targets.wheel.force-include]
"CONTRACT.md" = "agentos_kit/CONTRACT.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
